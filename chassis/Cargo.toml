[package]
name = "chassis"
version = "0.1.0"
description = "Chassis, the visual form designer for Pushrod: the project model"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "chassis"
path = "src/main.rs"

[lib]
name = "chassis"
path = "src/lib.rs"

[dependencies]
pushrod-widgets = { path = "../pushrod-widgets", version = "0.3.5" }
clap = { version = "4", features = ["derive"] }
pushrod = { path = "..", version = "0.3.5" }
toml_edit = "0.25"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"

[dev-dependencies]
tempfile = "3"
