name: Release

# Publishes pushrod, pushrod-widgets, and pushrod-sdl2 to crates.io when a version tag (v0.1.0,
# v0.2.0, ...) is pushed. Needs the repository secret CARGO_REGISTRY_TOKEN. A published version
# can be yanked but never replaced, so the release checks run first and nothing uploads unless
# they pass. See the documentation site's "Changelog, Cargo metadata, and crates.io release" page.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the crate version; changelog has the version section
        run: python3 scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Tests
        run: cargo test --workspace
      - name: Package and build every published crate
        run: cargo publish --workspace --dry-run
      - name: Publish (pushrod, then pushrod-widgets, then pushrod-sdl2)
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
