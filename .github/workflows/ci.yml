name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the minimum supported version (rust-version in Cargo.toml) and the latest
        # stable; macOS and Windows run the latest stable.
        include:
          - { os: ubuntu-latest, toolchain: "1.100.0" }
          - { os: ubuntu-latest, toolchain: stable }
          - { os: macos-latest, toolchain: stable }
          - { os: windows-latest, toolchain: stable }
    env:
      # Windows only: where the SDL2 development libraries are unpacked (see "Install SDL2").
      SDL_DIR: ${{ github.workspace }}/sdl
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2 sdl2_image sdl2_ttf
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$SDL_DIR" && cd "$SDL_DIR"
          base=https://github.com/libsdl-org
          curl -fsSL -o sdl2.zip "$base/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-VC.zip"
          curl -fsSL -o ttf.zip "$base/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-devel-2.22.0-VC.zip"
          curl -fsSL -o image.zip "$base/SDL_image/releases/download/release-2.8.2/SDL2_image-devel-2.8.2-VC.zip"
          for z in sdl2 ttf image; do unzip -q -o "$z.zip"; done
          # The linker finds the .lib files through LIB; the tests find the .dll files through PATH.
          libs=""
          for d in SDL2-2.30.9 SDL2_ttf-2.22.0 SDL2_image-2.8.2; do
            dir=$(cygpath -w "$SDL_DIR/$d/lib/x64")
            echo "$dir" >> "$GITHUB_PATH"
            libs="$libs$dir;"
          done
          echo "LIB=$libs${LIB:-}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Doc headers on every non-private item
        run: python3 scripts/check_docs.py
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  bundled:
    # SDL2 built from source (`bundled`), the route the installation guides offer on macOS and
    # Windows. SDL2_ttf and SDL2_image still come from the system: the sdl2 crate doesn't build
    # them from source. `bundled` with `static-link` isn't built: sdl2-sys 0.38 then links no
    # SDL2_ttf or SDL2_image, so Pushrod can't link.
    name: Bundled SDL2 build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      # Windows only: where the SDL2_ttf and SDL2_image development libraries are unpacked.
      SDL_DIR: ${{ github.workspace }}/sdl
      # The SDL2 source in sdl2-sys 0.38 declares a CMake minimum below 3.5, which CMake 4
      # rejects unless this policy floor is set.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - name: CMake and a C compiler (preinstalled on the runner)
        run: cmake --version
      - name: Install SDL2_ttf and SDL2_image (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sdl2_image sdl2_ttf
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Install SDL2_ttf and SDL2_image (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$SDL_DIR" && cd "$SDL_DIR"
          base=https://github.com/libsdl-org
          curl -fsSL -o ttf.zip "$base/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-devel-2.22.0-VC.zip"
          curl -fsSL -o image.zip "$base/SDL_image/releases/download/release-2.8.2/SDL2_image-devel-2.8.2-VC.zip"
          for z in ttf image; do unzip -q -o "$z.zip"; done
          libs=""
          for d in SDL2_ttf-2.22.0 SDL2_image-2.8.2; do
            dir=$(cygpath -w "$SDL_DIR/$d/lib/x64")
            echo "$dir" >> "$GITHUB_PATH"
            libs="$libs$dir;"
          done
          echo "LIB=$libs${LIB:-}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build with bundled
        run: cargo build -p pushrod-sdl2 --all-targets --features bundled

  golden:
    name: Golden-image rendering tests (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and Xvfb
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Render every widget and the contacts screens, and compare with tests/golden
        env:
          SDL_VIDEODRIVER: x11
          PUSHROD_GOLDEN: "1"
          PUSHROD_GOLDEN_DIFF_DIR: ${{ github.workspace }}/golden-diff
        run: xvfb-run -a cargo test -p pushrod-sdl2 --test visual --test contacts
      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: golden-diff/
          if-no-files-found: ignore

  benchmarks:
    name: Performance benchmarks (stored baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the benchmarks and compare with benches/baseline.json
        run: python3 scripts/check_benchmarks.py --output benchmark-results.json
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          if-no-files-found: ignore

  semver:
    name: Semver checks (published crates)
    # Runs once the crates have a published release to compare against: set the repository
    # variable SEMVER_CHECKS to "true" after the first release.
    if: github.event_name == 'pull_request' && vars.SEMVER_CHECKS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          workspace: true

  docs:
    name: Documentation checks (widget pages, checked samples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every widget module has a page
        run: python3 scripts/check_widget_pages.py
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Checked code samples compile
        run: cargo test -p pushrod-doc-samples

  sample-data:
    name: Sample data (no real e-mail addresses or home paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only reserved example domains and placeholder home paths
        run: python3 scripts/check_sample_data.py
