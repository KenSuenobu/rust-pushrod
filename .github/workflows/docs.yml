name: Documentation site

# Builds the Docusaurus site and the rustdoc API reference together, and publishes them as the
# `pushrod-docs` Docker image from main.  Pull requests build only (a broken link fails the
# build).  Needs the repository secrets DOCKER_REGISTRY (the registry host/namespace the image is
# pushed under), DOCKER_USERNAME, and DOCKER_PASSWORD.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site and API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pushrod-docs/package-lock.json
      - name: Build the site (broken links fail the build)
        working-directory: pushrod-docs
        run: npm ci && npm run build
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the API reference
        run: cargo doc --workspace --no-deps --exclude pushrod-doc-samples
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Publish the API reference at /api/
        run: cp -r target/doc pushrod-docs/build/api
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: pushrod-docs/build

  publish:
    name: Publish the pushrod-docs Docker image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: pushrod-docs/build
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: pushrod-docs
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/pushrod-docs:latest
            ${{ env.DOCKER_REGISTRY }}/pushrod-docs:${{ github.sha }}
