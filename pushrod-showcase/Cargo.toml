[package]
name = "pushrod-showcase"
version = "0.3.10"
description = "The Pushrod Showcase: an interactive demo of every widget"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "pushrod_showcase"
path = "src/lib.rs"

[[bin]]
name = "pushrod-showcase"
path = "src/main.rs"

[dependencies]
pushrod = { path = "..", version = "0.3.10" }
pushrod-widgets = { path = "../pushrod-widgets", version = "0.3.10" }
pushrod-sdl2 = { path = "../pushrod-sdl2", version = "0.3.10" }

# PNG reading and writing for the tour; the same version and features pushrod-sdl2 uses.
[dependencies.sdl2]
version = "0.38"
features = ["image", "unsafe_textures"]
