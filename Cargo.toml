[package]
name = "pushrod"
version = "0.0.16"
authors = ["Ken Suenobu <ksuenobu@fastmail.com>"]
edition.workspace = true
rust-version.workspace = true
description = "Pushrod UI Library: engine, widget tree, events, and drawing core"
license.workspace = true
readme = "README.md"
repository = "https://github.com/KenSuenobu/rust-pushrod"
documentation = "https://docs.rs/pushrod"
keywords = ["sdl", "sdl2", "pushrod", "ui", "gui"]
categories = ["gui", "graphics", "visualization"]
include = [
    "**/*.rs",
    "Cargo.toml",
]

[workspace]
members = ["pushrod-widgets", "pushrod-doc-samples"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/KenSuenobu/rust-pushrod"

[lib]
name = "pushrod"
path = "src/lib.rs"

[dependencies]
bitflags = "2"
# Optional text layout engine (shaping, bidi, line breaking, font fallback) and glyph rasterizer.
parley = { version = "0.13", optional = true }
swash = { version = "0.2", optional = true }
unicode-segmentation = "1"

# sdl2 0.39.0 doesn't compile with `unsafe_textures`; stay on 0.38 until a fixed release.
[dependencies.sdl2]
version = "0.38"
features = ["ttf", "image", "unsafe_textures"]

[features]
default = []
# Build SDL2 from source instead of using the system library (SDL2_ttf and SDL2_image
# still come from the system; the sdl2 crate doesn't bundle them).
bundled = ["sdl2/bundled"]
# Link SDL2 statically.
static-link = ["sdl2/static-link"]
# Lay out text with Parley and rasterize glyphs with swash instead of SDL2_ttf.
parley = ["dep:parley", "dep:swash"]

[[example]]
name = "parley_spike"
path = "examples/parley_spike.rs"
required-features = ["parley"]

