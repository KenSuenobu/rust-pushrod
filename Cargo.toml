[package]
name = "pushrod"
version = "0.0.1"
authors = ["Ken Suenobu <ksuenobu@fastmail.com>"]
edition = "2021"
rust-version = "1.86"
description = "Pushrod UI Library: engine, widget tree, events, and drawing core"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/KenSuenobu/rust-pushrod"
documentation = "https://docs.rs/pushrod"
keywords = ["sdl", "sdl2", "pushrod", "ui", "gui"]
categories = ["gui", "graphics", "visualization"]
include = [
    "**/*.rs",
    "Cargo.toml",
]

[workspace]
members = ["pushrod-widgets"]

[workspace.package]
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/KenSuenobu/rust-pushrod"

[lib]
name = "pushrod"
path = "src/lib.rs"

[dependencies.sdl2]
version = "^0.36.0"
features = ["ttf", "image", "unsafe_textures"]

