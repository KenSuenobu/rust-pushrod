[package]
name = "pushrod"
version = "0.3.8"
authors = ["Ken Suenobu <ksuenobu@fastmail.com>"]
edition.workspace = true
rust-version.workspace = true
description = "Pushrod UI Library: engine, widget tree, events, and drawing core"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pushrod"
keywords = ["sdl", "sdl2", "pushrod", "ui", "gui"]
categories = ["gui", "graphics", "visualization"]
include = [
    "**/*.rs",
    "assets/OpenSans-Regular.ttf",
    "assets/OFL.txt",
    "/LICENSE",
    "Cargo.toml",
]

[workspace]
members = ["pushrod-widgets", "pushrod-sdl2", "pushrod-doc-samples", "pushrod-showcase", "chassis"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/KenSuenobu/rust-pushrod"
homepage = "https://pushrod.nobudata.com"

[lib]
name = "pushrod"
path = "src/lib.rs"

[dependencies]
accesskit = { version = "0.25", optional = true }
bitflags = "2"
# Optional text layout engine (shaping, bidi, line breaking, font fallback) and glyph rasterizer.
parley = { version = "0.13", optional = true }
swash = { version = "0.2", optional = true }
unicode-segmentation = "1"

[features]
default = []
# Lay out text with Parley and rasterize glyphs with swash instead of SDL2_ttf.
parley = ["dep:parley", "dep:swash"]
# Convert accessibility updates to AccessKit trees (`AccessUpdate::to_accesskit`).
accesskit = ["dep:accesskit"]

# docs.rs documents the optional Parley text engine too.
[package.metadata.docs.rs]
features = ["parley"]
