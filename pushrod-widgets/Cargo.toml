[package]
name = "pushrod-widgets"
version = "0.2.0"
authors = ["Ken Suenobu <ksuenobu@fastmail.com>"]
description = "Standard widgets for the Pushrod UI library: simple, flat, and predictable"
readme = "README.md"
documentation = "https://docs.rs/pushrod-widgets"
keywords = ["pushrod", "ui", "gui"]
categories = ["gui", "graphics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "pushrod_widgets"
path = "src/lib.rs"

[dependencies]
pushrod = { path = "..", version = "0.2.0" }

[build-dependencies]
pushrod = { path = "..", version = "0.2.0" }

[dev-dependencies]
accesskit = "0.25"

[features]
default = []
parley = ["pushrod/parley"]
# Convert accessibility updates to AccessKit trees.
accesskit = ["pushrod/accesskit"]
