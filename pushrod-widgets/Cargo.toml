[package]
name = "pushrod-widgets"
version = "0.0.39"
authors = ["Ken Suenobu <ksuenobu@fastmail.com>"]
description = "Standard widgets for the Pushrod UI library: simple, flat, and predictable"
readme = "README.md"
documentation = "https://docs.rs/pushrod-widgets"
keywords = ["pushrod", "ui", "gui"]
categories = ["gui", "graphics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pushrod_widgets"
path = "src/lib.rs"

[dependencies]
pushrod = { path = "..", version = "0.0.40" }

[features]
default = []
parley = ["pushrod/parley"]
